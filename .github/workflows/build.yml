name: Build and browser verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-e2e:
    name: Install, audit, build and responsive browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-fund
      - name: Report dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop, Android-sized and iOS-WebKit browser tests
        run: npm run test:e2e
